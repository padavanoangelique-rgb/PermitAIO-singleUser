<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>PermitAIO Live Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f7fcff; --panel:#ffffff; --panel2:#e9f3ff; --line:#cde0f9; --ink:#0a0a0a; --mute:#515963;
  --brand:#005fe8; --brand-ink:#fcfcfc; --brand-soft:#d5eeff; --blue:#0040a4; --blue-soft:#e1f0ff;
  --ok:#15803d; --ok-soft:#dcf5e4; --warn:#b45309; --warn-soft:#fdeccb; --bad:#df202e; --bad-soft:#fde3e5;
  --shadow:0 1px 2px rgba(10,30,70,.06),0 8px 24px rgba(10,30,70,.08); --dim:rgba(6,16,40,.52);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif; --head:"Outfit","Plus Jakarta Sans",ui-sans-serif,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --panel:#121a2b; --panel2:#1a2740; --line:#2a3a52; --ink:#f4f7fb; --mute:#9aa8bd;
  --brand:#3b82f6; --brand-ink:#ffffff; --brand-soft:#1e3a5f; --blue:#93c5fd; --blue-soft:#1e3a5f;
  --ok:#34d399; --ok-soft:#12352a; --warn:#fbbf24; --warn-soft:#3d2d0c; --bad:#fb7185; --bad-soft:#3d1717;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4); --dim:rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1220; --panel:#121a2b; --panel2:#1a2740; --line:#2a3a52; --ink:#f4f7fb; --mute:#9aa8bd;
  --brand:#3b82f6; --brand-ink:#ffffff; --brand-soft:#1e3a5f; --blue:#93c5fd; --blue-soft:#1e3a5f;
  --ok:#34d399; --ok-soft:#12352a; --warn:#fbbf24; --warn-soft:#3d2d0c; --bad:#fb7185; --bad-soft:#3d1717;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4); --dim:rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
#app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:auto auto 1fr;height:100%}
.rolebar{grid-column:1/-1;display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:thin}
.rolebar button{flex:none;border:1px solid var(--line);background:var(--panel2);color:var(--mute);border-radius:999px;padding:6px 13px;font-weight:700;font-size:12.5px;white-space:nowrap}
.rolebar button:hover{border-color:var(--brand);color:var(--ink)}
.rolebar button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
#app.nosb{grid-template-columns:1fr}#app.nosb aside{display:none}
.ribbon{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 16px;background:var(--brand);color:var(--brand-ink);font-weight:600;font-size:13px}
.ribbon .sp{flex:1}
.ribbon button{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:inherit;border-radius:999px;padding:4px 12px;font-weight:600}
aside{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;padding:4px 8px 4px;letter-spacing:-.02em}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:var(--brand-ink);font-style:normal;font-size:13px}
.whoami{margin:0 8px 10px;font-size:12px;color:var(--mute)}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:0;background:none;text-align:left;font-weight:600;color:var(--mute);width:100%}
.nav:hover{background:var(--panel2);color:var(--ink)}
.nav.on{background:var(--brand-soft);color:var(--brand)}
.nav b{width:22px;height:22px;border-radius:7px;background:var(--panel2);display:grid;place-items:center;font-size:11px;color:var(--mute);flex:none}
.nav.on b{background:var(--brand);color:var(--brand-ink)}
main{overflow:auto;padding:20px 24px 60px;min-width:0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.top h1{margin:0;font-size:22px;letter-spacing:-.02em;flex:1;min-width:160px}
h1,h2,h3,.brand,.modal h2,#coach h3{font-family:var(--head)}
.about{border:1px dashed var(--brand);background:var(--brand-soft);border-radius:12px;padding:10px 14px;margin-bottom:16px;display:flex;gap:10px;font-size:13px}
.about strong{color:var(--brand);white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.pad{padding:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.kpi{padding:14px 16px}.kpi small{color:var(--mute);font-weight:600}.kpi div{font-size:26px;font-weight:800;letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;background:var(--panel2);color:var(--mute);white-space:nowrap}
.p-brand{background:var(--brand);color:var(--brand-ink)}.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-blue{background:var(--blue-soft);color:var(--blue)}.p-bad{background:var(--bad-soft);color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 14px;font-weight:700}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}.btn.pri:hover{filter:brightness(1.08);color:var(--brand-ink)}
.btn.sm{padding:4px 10px;font-size:12px}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
textarea{min-height:170px;resize:vertical}
label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:700;margin:10px 0 4px}
label.chk{text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ink);font-weight:500;display:flex;gap:8px;margin:6px 0;align-items:center}
label.chk input{width:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.scroll{overflow-x:auto}
.mono{font-family:var(--mono);font-size:12.5px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0 16px}
.tab{border:0;background:none;padding:7px 12px;border-radius:9px;font-weight:700;color:var(--mute)}
.tab:hover{background:var(--panel2)}.tab.on{background:var(--brand);color:var(--brand-ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.sp1{flex:1}
.mut{color:var(--mute)}
.inbox-h{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:12px 16px;text-align:left;font-weight:700}
.inbox-item{display:flex;gap:10px;align-items:flex-start;padding:9px 16px;border-top:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:7px;flex:none}
.x{border:0;background:none;color:var(--mute);font-size:16px;line-height:1;padding:2px 6px;border-radius:6px}.x:hover{background:var(--panel2);color:var(--ink)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.stp{flex:1;min-width:110px;border-radius:10px;padding:8px 10px;background:var(--panel2);font-size:12px;font-weight:700;color:var(--mute)}
.stp.done{background:var(--ok-soft);color:var(--ok)}.stp.now{background:var(--brand);color:var(--brand-ink)}
.canvas{position:relative;background:repeating-linear-gradient(0deg,transparent 0 23px,var(--line) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,var(--line) 23px 24px),var(--panel);border:1px solid var(--line);border-radius:14px;height:340px;overflow:hidden;cursor:crosshair}
.room{position:absolute;border:3px solid var(--ink);border-radius:2px}
.win{position:absolute;width:44px;height:8px;background:var(--blue);border-radius:2px;transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--blue-soft)}
.rail{display:flex;flex-direction:column;gap:6px}
.lane{background:var(--panel2);border-radius:14px;padding:10px;min-height:120px}
.lane h4{margin:2px 4px 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.lane .card{padding:10px;margin-bottom:8px}
.phone{max-width:380px;margin:0 auto;border:8px solid var(--ink);border-radius:32px;background:var(--panel);padding:14px;box-shadow:var(--shadow)}
.cal{display:grid;grid-template-columns:repeat(5,minmax(80px,1fr));gap:6px}
.cal div{background:var(--panel2);border-radius:10px;padding:8px;min-height:90px;font-size:12px}
.cal b{display:block;margin-bottom:4px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:80;box-shadow:var(--shadow);max-width:90vw}
.modal-back{position:fixed;inset:0;background:var(--dim);z-index:70;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:18px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:var(--shadow)}
.modal h2{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
.rolegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:14px}
.role{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 14px}
.role:hover{border-color:var(--brand);background:var(--brand-soft)}
.role b{display:block;font-size:15px}.role span{color:var(--mute);font-size:12.5px;display:block;margin-top:2px}
.role em{font-style:normal;font-size:11px;font-weight:700;color:var(--brand);letter-spacing:.04em;display:block;margin-top:6px}
.tour-card{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px;margin-top:8px}
.tour-card:hover{border-color:var(--brand);background:var(--brand-soft)}
.tour-card b{display:block}
.doc{border:1px solid var(--line);border-radius:12px;background:#fff;color:#111;padding:14px;font-family:var(--mono);font-size:11.5px;overflow-x:auto}
#ring{position:fixed;z-index:60;pointer-events:none;border-radius:12px;box-shadow:0 0 0 9999px var(--dim),0 0 0 3px var(--brand),0 0 0 7px color-mix(in srgb,var(--brand) 35%,transparent);transition:all .25s ease;display:none}
#ptr{position:fixed;z-index:62;pointer-events:none;display:none;color:var(--brand);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
#ptr svg{display:block}
#ptr.b{animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translate(var(--bx,0),var(--by,0))}}
#coach{position:fixed;z-index:65;width:min(330px,calc(100vw - 24px));background:var(--panel);border:2px solid var(--brand);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);display:none}
#coach h3{margin:0 0 4px;font-size:15px;letter-spacing:-.01em}
#coach p{margin:0 0 10px;font-size:13.5px}
#coach .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.hint{display:inline-block;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:2px 8px;font-weight:700;font-size:12px;margin-bottom:8px}
@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:auto auto auto 1fr}
  aside{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px;align-items:center}
  .brand,.whoami{display:none}.nav{width:auto;white-space:nowrap}
  main{padding:14px 16px 60px}
}
@media (prefers-reduced-motion:reduce){#ring{transition:none}#ptr.b{animation:none}}
/* ---- Match permitaio.com pills, cards and details (FILL_* colors: purple #7f22fe, blue primary, green #009966, amber #fe9a00) ---- */
:root{--purple:#7f22fe;--green:#009966;--amber:#fe9a00}
.pill{display:inline-flex;align-items:center;height:auto;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--brand);color:var(--brand-ink);box-shadow:0 1px 2px rgba(10,20,50,.12)}
.pill.p-brand,.pill.p-blue{background:var(--brand);color:var(--brand-ink)}
.pill.p-ok{background:var(--green);color:#fff}.pill.p-warn,.pill.p-bad{background:var(--amber);color:#fff}
.pill.p-purple{background:var(--purple);color:#fff}
.about{border:none;background:color-mix(in srgb,var(--panel2) 55%,var(--panel));border-radius:16px;padding:14px 18px}
.about strong{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;background:var(--purple);color:#fff;font-size:13px;font-weight:600;box-shadow:0 1px 2px rgba(10,20,50,.12)}
.card{border-radius:16px}
.card.kpi{background:color-mix(in srgb,var(--panel2) 55%,var(--panel));border-color:transparent;text-align:center;padding:18px 16px}
.kpi small{font-size:12px;letter-spacing:.06em;text-transform:uppercase}.kpi div{font-family:var(--head)}
.btn{border-radius:999px;padding:8px 16px}.btn.pri{box-shadow:0 1px 2px rgba(10,20,50,.12)}.btn.sm{padding:5px 12px}
.stp{border-radius:999px;padding:8px 14px;text-align:center}.stp.done{background:var(--green);color:#fff}.stp.now{background:var(--brand);color:var(--brand-ink)}
.tab{border-radius:999px}.top h1{font-family:var(--head)}
.inbox-item .pill{font-size:12px;padding:3px 10px}
/* ---- Floor plan builder: matches the real builder chrome (floor-plan-theme.css) ---- */
:root{--fp-blue:#2563eb;--fp-purple:#7c3aed;--fp-green:#059669;--fp-on:#ffffff;--fp-canvas:#dfe3e8;--fp-panel:#ffffff;--fp-line:#e5e7eb;--fp-field:#d1d5db;--fp-ink:#111827;--fp-mut:#6b7280;--fp-chip:#f3f4f6;--fp-grid:rgba(17,24,39,.10);--fp-wall:#111827}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fp-blue:#3b82f6;--fp-purple:#a78bfa;--fp-green:#34d399;--fp-on:#ffffff;--fp-canvas:#0e1626;--fp-panel:#121a2b;--fp-line:#2a3a52;--fp-field:#3d4f6b;--fp-ink:#f4f7fb;--fp-mut:#9aa8bd;--fp-chip:#1a2740;--fp-grid:rgba(244,247,251,.10);--fp-wall:#f4f7fb}}
:root[data-theme="dark"]{--fp-blue:#3b82f6;--fp-purple:#a78bfa;--fp-green:#34d399;--fp-on:#ffffff;--fp-canvas:#0e1626;--fp-panel:#121a2b;--fp-line:#2a3a52;--fp-field:#3d4f6b;--fp-ink:#f4f7fb;--fp-mut:#9aa8bd;--fp-chip:#1a2740;--fp-grid:rgba(244,247,251,.10);--fp-wall:#f4f7fb}
.fpwrap{font-family:Inter,var(--font);border:1px solid var(--fp-line);border-radius:14px;overflow:hidden;background:var(--fp-panel);color:var(--fp-ink)}
.fp-head{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 10px;background:var(--fp-panel);border-bottom:1px solid var(--fp-line)}
.fp-tab{height:32px;padding:0 14px;border:none;border-radius:999px;background:var(--fp-chip);color:var(--fp-ink);font:600 13px Inter,var(--font);box-shadow:0 1px 2px rgba(15,23,42,.08)}
.fp-tab.blue.on,.fp-tab.purple.on,.fp-tab.green.on,.fp-pdf{background:var(--fp-blue);color:var(--fp-on)}
.fp-tab.purple.on{background:var(--fp-purple)}.fp-tab.green.on{background:var(--fp-green)}
.fp-pick{display:inline-flex}.fp-pick .fp-tab{border-radius:999px 0 0 999px}
.fp-pick select{height:32px;width:auto;max-width:180px;border-radius:0 999px 999px 0;border:1px solid var(--fp-field);background:var(--fp-panel);color:var(--fp-ink);padding:0 12px;font:13px Inter,var(--font)}
.fp-pdf{height:32px;padding:0 16px;border:none;border-radius:999px;font:700 13px Inter,var(--font);background:var(--fp-green);color:var(--fp-on)}
.fp-body{display:flex;min-height:470px}
.fp-rail{display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--fp-panel);border-right:1px solid var(--fp-line)}
.fp-rb{min-width:46px;min-height:46px;border:1px solid var(--fp-field);border-radius:999px;background:var(--fp-panel);color:var(--fp-ink);font:500 11px Inter,var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0 4px}
.fp-rb i{font-style:normal;font-size:17px;line-height:1}.fp-rb.on{background:var(--fp-blue);border-color:var(--fp-blue);color:var(--fp-on)}
.fp-wrap{position:relative;flex:1;min-width:0;background:var(--fp-canvas)}
.fp-chips{position:absolute;top:8px;left:10px;right:10px;z-index:3;display:flex;gap:4px;overflow-x:auto}
.fp-chips span{flex:none;height:24px;padding:0 10px;border-radius:999px;font:600 11px/24px Inter,var(--font);background:var(--fp-panel);color:var(--fp-ink);border:1px solid var(--fp-line)}
.fp-canvas{position:absolute;inset:0;cursor:crosshair;background:repeating-linear-gradient(0deg,transparent 0 23px,var(--fp-grid) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,var(--fp-grid) 23px 24px)}
.fp-room{position:absolute;border:3px solid var(--fp-wall)}
.fp-rlabel{position:absolute;font:600 12px Inter,var(--font);color:var(--fp-wall);pointer-events:none}
.fp-win{position:absolute;width:46px;height:9px;background:var(--fp-blue);border-radius:2px;transform:translate(-50%,-50%);box-shadow:0 0 0 3px color-mix(in srgb,var(--fp-blue) 25%,transparent);cursor:pointer}
.fp-win b{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font:700 10px Inter,var(--font);color:var(--fp-blue);background:var(--fp-panel);border-radius:999px;padding:0 6px}
.fp-win.sel{outline:2px solid var(--fp-ink);outline-offset:3px}
.fp-hint{position:absolute;left:12px;bottom:10px;z-index:2;font:600 12px Inter,var(--font);background:var(--fp-panel);color:var(--fp-ink);padding:4px 12px;border-radius:999px;border:1px solid var(--fp-line)}
.fp-card{position:absolute;top:44px;right:14px;z-index:6;width:340px;max-width:calc(100% - 28px);max-height:calc(100% - 60px);display:flex;flex-direction:column;background:var(--fp-panel);color:var(--fp-ink);border-radius:20px;box-shadow:0 14px 34px rgba(0,0,0,.28);padding:8px 8px 10px}
.fp-card .head{font:11px Inter,var(--font);color:var(--fp-mut);padding:4px 8px 6px}
.fp-card .sheet{display:block;width:calc(100% - 8px);margin:0 4px 8px;border:none;background:var(--fp-purple);color:var(--fp-on);border-radius:999px;height:32px;font:700 12px Inter,var(--font)}
.fp-card .scr{overflow:auto;flex:1;min-height:0}
.fp-card table{font-size:11px}.fp-card th,.fp-card td{padding:4px 5px;border-bottom:1px solid var(--fp-line);text-align:left;white-space:nowrap}
.fp-card th{font-size:10px;color:var(--fp-mut);font-weight:600;letter-spacing:0;text-transform:none}
.fp-card tr.is-selected td{background:rgba(37,99,235,.10)}
.fp-num{cursor:pointer;font-weight:700;color:var(--fp-blue)}
.fp-in{width:44px;height:24px;border:1px solid var(--fp-field);border-radius:999px;padding:0 6px;font-size:12px;background:var(--fp-panel);color:var(--fp-ink)}
.fp-type{max-width:118px;height:24px;border:none;border-radius:999px;padding:0 8px;font:600 11px Inter,var(--font);background:var(--fp-chip);color:var(--fp-ink)}
.fp-zc{display:flex;gap:4px}.fp-z{width:24px;height:24px;border:none;border-radius:999px;background:var(--fp-chip);color:var(--fp-ink);font:700 11px Inter,var(--font)}.fp-z.on{background:var(--fp-blue);color:var(--fp-on)}

function tourMenu(){
 endTour();if(!S.role){chooser();return}
 openModal('<h2>Guided tours: '+role().name+'</h2><p class="mut" style="margin:0 0 6px">Follow the arrows, click the highlighted spot, and the tour moves on. Or close this and click around freely. Every screen explains what it does.</p>'+role().tours.map(function(id){var t=TD[id];return '<button class="tour-card" data-tour="'+id+'"><b>'+t.name+'</b><span class="mut">'+t.desc+'</span></button>'}).join('')+'<div class="row" style="justify-content:space-between;margin-top:14px"><button class="btn" data-role-pick="1" id="pickRole">Choose another user type</button><button class="btn pri" data-close="1">Explore on my own</button></div>')}
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-tour]');if(b){$('#layer').innerHTML='';startTour(b.getAttribute('data-tour'));return}
 if(e.target.closest('[data-role-pick]'))chooser()});
function startTour(id){TOUR=TD[id];SI=0;tourOn=true;showStep()}
function endTour(){tourOn=false;TOUR=null;$('#ring').style.display='none';$('#ptr').style.display='none';$('#coach').style.display='none'}
function showStep(){var s=TOUR.steps[SI];if(s.go)s.go();else render();schedulePlace()}
function next(){if(!tourOn)return;if(SI>=TOUR.steps.length-1){endTour();toast('Tour finished. Keep exploring!');return}SI++;showStep()}
function prev(){if(SI>0){SI--;showStep()}}
function schedulePlace(){clearTimeout(placeT);placeT=setTimeout(place,90)}
function place(){
 if(!tourOn)return;var s=TOUR.steps[SI],el=$(s.sel);var ring=$('#ring'),ptr=$('#ptr'),c=$('#coach');
 if(!el){c.style.display='block';c.innerHTML='<h3>'+s.title+'</h3><p>Go back to the screen this step needs, then continue.</p><div class="meta"><button class="btn sm" id="tPrev">Back</button><button class="btn sm" id="tNext">Skip</button><button class="btn sm" id="tExit">Exit tour</button></div>';c.style.left='12px';c.style.top='90px';wireCoach();ring.style.display='none';ptr.style.display='none';return}
 el.scrollIntoView({block:'center',inline:'nearest',behavior:'auto'});
 var r=el.getBoundingClientRect(),pad=6;
 ring.style.display='block';ring.style.left=(r.left-pad)+'px';ring.style.top=(r.top-pad)+'px';ring.style.width=(r.width+pad*2)+'px';ring.style.height=(r.height+pad*2)+'px';
 c.style.display='block';
 c.innerHTML=(s.click?'<span class="hint">Click the highlighted spot</span>':'')+'<h3>'+s.title+'</h3><p>'+s.text+'</p><div class="meta"><span>Step '+(SI+1)+' of '+TOUR.steps.length+'</span><span style="flex:1"></span>'+(SI>0?'<button class="btn sm" id="tPrev">Back</button>':'')+'<button class="btn sm '+(s.click?'':'pri')+'" id="tNext">'+(s.click?'Skip':(SI===TOUR.steps.length-1?'Finish':'Next'))+'</button><button class="btn sm" id="tExit">Exit</button></div>';
 wireCoach();
 var cw=c.offsetWidth,ch=c.offsetHeight,vw=innerWidth,vh=innerHeight,gap=46,side=s.side||'bottom';
 function fits(sd){if(sd==='right')return r.right+gap+cw<vw;if(sd==='left')return r.left-gap-cw>0;if(sd==='bottom')return r.bottom+gap+ch<vh;return r.top-gap-ch>0}
 [side,'bottom','top','right','left'].some(function(sd){if(fits(sd)){side=sd;return true}});
 var x,y,ax,ay,rot;
 if(side==='right'){x=r.right+gap;y=r.top+r.height/2-ch/2;ax=r.right+8;ay=r.top+r.height/2-16;rot=180}
 else if(side==='left'){x=r.left-gap-cw;y=r.top+r.height/2-ch/2;ax=r.left-46;ay=r.top+r.height/2-16;rot=0}
 else if(side==='bottom'){x=r.left+r.width/2-cw/2;y=r.bottom+gap;ax=r.left+r.width/2-16;ay=r.bottom+6;rot=270}
 else{x=r.left+r.width/2-cw/2;y=r.top-gap-ch;ax=r.left+r.width/2-16;ay=r.top-44;rot=90}
 x=Math.max(12,Math.min(vw-cw-12,x));y=Math.max(12,Math.min(vh-ch-12,y));
 c.style.left=x+'px';c.style.top=y+'px';
 ptr.innerHTML='<svg width="38" height="32" viewBox="0 0 38 32" style="transform:rotate('+rot+'deg)"><path d="M2 16 L20 2 V11 H36 V21 H20 V30 Z" fill="currentColor" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>';
 ptr.style.display='block';ptr.style.left=ax+'px';ptr.style.top=ay+'px';
 ptr.style.setProperty('--bx',side==='right'?'6px':side==='left'?'-6px':'0');ptr.style.setProperty('--by',side==='bottom'?'6px':side==='top'?'-6px':'0');ptr.className='b'}
function wireCoach(){var n=$('#tNext'),p=$('#tPrev'),x=$('#tExit');if(n)n.onclick=next;if(p)p.onclick=prev;if(x)x.onclick=endTour}
document.addEventListener('click',function(e){if(!tourOn)return;var s=TOUR.steps[SI];if(s&&s.click&&e.target.closest(s.sel)){setTimeout(next,320)}},true);
