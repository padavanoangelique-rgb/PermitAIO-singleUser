<style>

.chip.arm{background:var(--purple);color:var(--on);border-color:var(--purple)}

.btn{height:38px;border:0;border-radius:999px;background:var(--blue);color:var(--on);font-weight:700;font-size:14.5px;padding:0 16px}

.sched td.l{text-align:left}

.tag.ok{background:color-mix(in srgb,var(--green) 22%,transparent);color:var(--green)}.tag.bad{background:var(--warnbg);color:var(--warn)}
  .noaPick{background:none;border:0;padding:0;font:inherit;color:var(--blue);text-decoration:underline;cursor:pointer}.noaLib{display:flex;gap:8px;flex-wrap:wrap;padding:8px 4px}.noaCirc{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:999px;background:var(--blue);color:var(--on);font-size:11px;font-weight:700;cursor:pointer;border:2px solid transparent}.noaCirc:hover{border-color:var(--purple)}#tourRing{position:fixed;z-index:60;pointer-events:none;border-radius:12px;box-shadow:0 0 0 9999px rgba(15,23,42,.55),0 0 0 3px var(--purple);transition:all .2s ease;display:none}#tourBox{position:fixed;z-index:65;width:min(320px,calc(100vw - 24px));background:var(--panel);border:2px solid var(--purple);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);display:none;color:var(--ink)}#tourBox h3{margin:0 0 4px;font-size:15px}#tourBox p{margin:0 0 10px;font-size:14px;line-height:1.45}#tourBox .row2{display:flex;gap:8px;justify-content:flex-end}#tourBox button{height:30px;border:0;border-radius:999px;padding:0 12px;font-weight:700;font-size:13px;cursor:pointer}#tourBox .skip{background:var(--chip);color:var(--ink)}#tourBox .next{background:var(--purple);color:#fff}
.scroll{overflow-x:auto}

one ready-to-submit permit package. That is the whole builder in a handful of clicks.',before:function(){S.tab='plan';render()}}];function positionTour(step,i){var el=document.querySelector(step.sel);var ring=$('#tourRing'),box=$('#tourBox');if(el){var r=el.getBoundingClientRect();ring.style.left=(r.left-6)+'px';ring.style.top=(r.top-6)+'px';ring.style.width=(r.width+12)+'px';ring.style.height=(r.height+12)+'px';ring.style.display='block';var bw=Math.min(320,window.innerWidth-24);var bt=r.bottom+12;if(bt+180>window.innerHeight)bt=Math.max(12,r.top-180);var bl=Math.min(Math.max(12,r.left),window.innerWidth-bw-12);box.style.top=bt+'px';box.style.left=bl+'px'}else{ring.style.display='none';box.style.top=(window.innerHeight/2-90)+'px';box.style.left=(window.innerWidth/2-160)+'px'}box.style.display='block';box.innerHTML='<h3>'+esc(step.title)+'</h3><p>'+esc(step.text)+'</p><div class="row2"><button class="skip" id="tourSkip">Skip</button><button class="next" id="tourNext">'+(i===TOUR.length-1?'Done':'Next')+'</button></div>';$('#tourSkip').onclick=endTour;$('#tourNext').onclick=function(){showTourStep(i+1)}}function showTourStep(i){if(i<0||i>=TOUR.length){endTour();return}var step=TOUR[i];if(step.before)step.before();if(step.action)step.action();positionTour(step,i)}function endTour(){var ring=$('#tourRing'),box=$('#tourBox');if(ring)ring.style.display='none';if(box)box.style.display='none'}$('#tourBtn').addEventListener('click',function(){showTourStep(0)});sample(true);S.hist=[];
